name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/projetssd/ssdv2-webui

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tags.outputs.publish }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Tester la politique de publication
        run: python3 scripts/tests/test_image_tags.py
      - name: Choisir les tags depuis la référence Git
        id: tags
        run: |
          tags=$(bash scripts/image-tags.sh)
          if [ -n "$tags" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tags=$tags" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13 + cache pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Lint et tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, types, tests et build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  image:
    needs: [backend, frontend, policy]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Buildx
        uses: docker/setup-buildx-action@v3
      - name: Connexion GHCR
        if: needs.policy.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Métadonnées OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - name: Build (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.policy.outputs.publish == 'true' }}
      - name: Exporter le digest
        if: needs.policy.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Publier le digest
        if: needs.policy.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [image, policy]
    if: needs.policy.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Buildx
        uses: docker/setup-buildx-action@v3
      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Créer le manifeste multiarchitecture
        env:
          TAGS: ${{ needs.policy.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tag_list <<< "$TAGS"
          args=()
          for tag in "${tag_list[@]}"; do
            [ -n "$tag" ] && args+=("-t" "$tag")
          done
          digests=()
          for file in /tmp/digests/*; do
            digests+=("${IMAGE}@sha256:$(basename "$file")")
          done
          docker buildx imagetools create "${args[@]}" "${digests[@]}"
          for tag in "${tag_list[@]}"; do
            docker buildx imagetools inspect "$tag" >/dev/null
            echo "Manifeste multiarchitecture publié : $tag"
          done
